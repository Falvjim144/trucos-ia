name: Publicar Trucos IA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar el catálogo
        run: python scripts/validar_novedades.py data/updates.json
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar web
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
